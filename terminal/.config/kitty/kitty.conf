# Set Zsh as the default shell for Kitty
shell zsh

# Set font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# padding
window_padding_width 0 12

# Allow programs to run remote control commands
allow_remote_control yes

# color
foreground #ffffff
background #000000
