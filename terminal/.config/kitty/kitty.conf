# Set Zsh as the default shell for Kitty
shell zsh

# Set font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# padding
window_padding_width 0 12

# Allow programs to run remote control commands
allow_remote_control yes

# ============================================================================
# NEOBRUTALISM THEME
# ============================================================================

# Basic UI
background            #000000
foreground            #ffffff
cursor                #ffffff
cursor_text_color     #000000
selection_background  #3a3a3a
selection_foreground  #ffffff

# URL underline color when hovering with mouse
url_color             #3d8bf5

# Window borders 
active_border_color   #8e8e8e
inactive_border_color #404040

# ============================================================================
# 16-COLOR ANSI PALETTE
# ============================================================================

# Black (Backgrounds/UI accents)
color0  #1a1a1a
color8  #989898

# Red (Errors/Booleans)
color1  #f55d3d
color9  #f55d3d

# Green (Strings/Regex/Success)
color2  #3df58b
color10 #3df58b

# Yellow (Warnings/Strings)
color3  #f5b83d
color11 #f5b83d

# Blue (Types/Folders)
color4  #3d8bf5
color12 #3d8bf5

# Magenta (Preprocessors/Macros)
color5  #d93df5
color13 #d93df5

# Cyan (Constants/Secondary accents mapped to our Copper)
color6  #d97a3d
color14 #d97a3d

# White (Structure/Foreground text)
color7  #d9d9d9
color15 #ffffff
